appId: com.scottsmith.ame
productName: Archive Markdown Editor
electronFuses:
  # 启用 ASAR 完整性校验
  enableEmbeddedAsarIntegrityValidation: true
  # （可选，但推荐）确保 Electron 仅从 app.asar 加载应用程序代码
  onlyLoadAppFromAsar: true
directories:
  buildResources: build
files:
  - '**/*'  # 先包含所有文件
  # 然后是排除的文件
  - '!dist/**'
  - '!node_modules/**'
  - '!**/.vscode/*'
  - '!.git/**'
  - '!src/*'
  - '!libs/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!utils/**'
  - '!test.js'
  # 然后是包含的文件
  # better-sqlite3 v13 起 gypfile:false，不再编译 build/，改为随包发布 prebuilds/<platform>-<arch>.node
  - 'node_modules/better-sqlite3/prebuilds/**'
  - 'node_modules/better-sqlite3/lib/**'
  - 'node_modules/better-sqlite3/package.json'
  - 'node_modules/xlsx/bower.json'
  - 'node_modules/xlsx/package.json'
  - 'node_modules/xlsx/bin/**'
  - 'node_modules/xlsx/dist/**'
  - 'node_modules/xlsx/xlsx.js'
  - 'node_modules/xlsx/xlsx.mjs'
  - 'node_modules/xlsx/xlsxworker.js'
  - 'libs/napi_cpp/mdz_utils/bin/**'
  - 'libs/napi_cpp/mdz_utils/lib/**'
  - 'libs/napi_cpp/mdz_utils/index.js'
  - 'libs/napi_cpp/mdz_utils/index.d.ts'
  - 'libs/napi_cpp/mdz_utils/package.json'
  # 导出HTML离线化：src/main/themes/export_assets.js 会把这些浏览器端构建
  # 复制进导出目录的“导出文件名.media_dir”，生产包里必须带着（只进asar，无需解包）
  - 'node_modules/prismjs/components/prism-*.min.js'
  - 'node_modules/prismjs/plugins/*/prism-*.min.js'
  - 'node_modules/prismjs/plugins/*/prism-*.min.css'
  - 'node_modules/prismjs/themes/prism.min.css'
  - 'node_modules/mermaid/dist/mermaid.min.js'
  - 'resources/**'
asarUnpack:
  - 'resources/**'
  # 原生 .node 必须解包出 asar 才能被 dlopen
  - 'node_modules/better-sqlite3/prebuilds/**'
  - 'node_modules/better-sqlite3/lib/**'
  - 'node_modules/better-sqlite3/package.json'
  - 'node_modules/xlsx/bower.json'
  - 'node_modules/xlsx/package.json'
  - 'node_modules/xlsx/bin/**'
  - 'node_modules/xlsx/dist/**'
  - 'node_modules/xlsx/xlsx.js'
  - 'node_modules/xlsx/xlsx.mjs'
  - 'node_modules/xlsx/xlsxworker.js'
  - 'libs/napi_cpp/mdz_utils/bin/**'
  - 'libs/napi_cpp/mdz_utils/lib/**'
  - 'libs/napi_cpp/mdz_utils/index.js'
  - 'libs/napi_cpp/mdz_utils/index.d.ts'
  - 'libs/napi_cpp/mdz_utils/package.json'
  - 'document/**'
  - 'resources/**'
win:
  executableName: archive_markdown_editor
  icon: 'resources/icon.ico'
  target:
    - target: nsis
      arch:
        - x64
#        - arm64
nsis:
  oneClick: false                           # 必须设置为 false，否则会直接一键安装到 C 盘，不给用户选择机会
  allowToChangeInstallationDirectory: true # 开启自定义安装路径按钮
  installerIcon: "resources/icon.ico"           # 安装程序图标
  uninstallerIcon: "resources/icon.ico"         # 卸载程序图标
  installerHeaderIcon: "resources/icon.ico"     # 安装界面左上角小图标
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  perMachine: true
  include: custom_nsis/default.nsh
mac:
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  icon: 'resources/icon.icns'
  target:
    - target: dmg
      arch:
        - arm64
#        - x64
dmg:
  artifactName: ${name}-${version}.${ext}
  background: "resources/dmg_back.jpg"
  window:
    width: 802    # 窗口宽度
    height: 620   # 窗口高度
    x: 300        # 窗口在屏幕上的初始 X 坐标
    y: 300        # 窗口在屏幕上的初始 Y 坐标
  contents:
    - x: 173
      y: 274
      type: "file"
    - x: 600
      y: 278
      type: "link"
      path: "/Applications"
linux:
  icon: 'resources/icon.png'
  target:
    - AppImage
    - deb
  maintainer: scottsmith666.github.io
  category: Utility
  # ── Linux 桌面集成（1/3）：让“双击文件”真正把文件交给 AME ──────────────
  # 生成的 .desktop 里 Exec 会变成
  #   Exec="/opt/Archive Markdown Editor/archive-markdown-editor" --direct-open-file=%f
  # %f 由桌面环境替换成“单个本地文件绝对路径”（含空格/中文都可以），
  # 正好对上主进程已有的启动参数解析（src/main/index.js 里的 --direct-open-file=）。
  # 从应用网格/菜单启动（没有文件）时，GLib 会把 %f 抹掉，只剩空值
  # “--direct-open-file=”，主进程按假值忽略，启动行为不变（已用 gio launch 实测）。
  # 注意：electron-builder 只在 executableArgs 里出现“独立的 %f/%F/%u/%U”时才不追加 %U，
  # 我们这个写法会被追加成 “--direct-open-file=%f %U”，desktop-file-validate 会报
  # “may contain at most one field code”。GLib（GNOME/Nautilus，实测）与 KDE 都能正确处理：
  # 单文件时只会传一个 --direct-open-file=<绝对路径>，多文件时才多一个被主进程忽略的多余参数。
  executableArgs:
    - '--direct-open-file=%f'
  # ── Linux 桌面集成（2/3）：复用系统已有的 MIME 类型 ────────────────────
  # 只把这些类型写进 .desktop 的 MimeType=，不注册新 glob，
  # 避免和 shared-mime-info 里已有的 *.md / *.txt 规则撞车。
  # 写进 MimeType= 之后，GNOME“设置 → 默认应用程序”和文件管理器“打开方式”里才会出现 AME。
  mimeTypes:
    - text/markdown
    - text/x-markdown
    - text/plain
  # ── Linux 桌面集成（3/3）：注册 mdz 这个 AME 私有格式 ──────────────────
  # 系统 MIME 库里根本没有 mdz，不注册的话 *.mdz 会被 magic 嗅探成 application/zip
  # （“打开方式”里跟压缩软件抢，设为默认还会把 zip 也抢走）。
  # electron-builder 会据此生成 /usr/share/mime/packages/archive-markdown-editor.xml，
  # 装包时 after-install 脚本自动跑 update-mime-database / update-desktop-database 生效。
  # 只在 linux 下声明，避免影响 NSIS（写注册表）与 macOS（CFBundleDocumentTypes）。
  # MIME 名用 application/prs.archive-markdown-format：prs. 是 RFC 6838 的 personal 树，
  # 专给未向 IANA 注册的自有格式（vnd. 树是留给已注册厂商类型的，x- 前缀则是历史写法），
  # 且 shared-mime-info 上游本来就有 application/prs.plucker、audio/prs.sid 这种条目，
  # update-mime-database / GLib / xdg-mime 全链路实测正常（*.mdz 的 glob 规则优先于 zip magic）。
  fileAssociations:
    - ext: mdz
      name: Archive Markdown Editor Archive
      description: Archive Markdown Editor archive document
      mimeType: application/prs.archive-markdown-format
  desktop:
    entry:
      # StartupWMClass 要和窗口的 WM_CLASS 一致，GNOME 才能把运行中的窗口归到本图标
      # （旧值回退成 productName “Archive Markdown Editor”，本机 xprop 实测根本对不上）。
      # 注意：MimeType / Categories / Comment 由 electron-builder 在 entry 之后覆盖，
      # 所以那三项必须走上面的 linux.mimeTypes / linux.category / description，不能写在这里。
      StartupWMClass: archive-markdown-editor
      GenericName: Markdown Editor
      Keywords: markdown;md;mdz;editor;archive;
appImage:
  artifactName: ${name}-${version}.${ext}
  # AppImage 的 .desktop 由 electron-builder 生成，且无条件在 Exec 末尾追加 %U；
  # 一旦设置 executableArgs，它原本的默认参数 --no-sandbox 就会被丢掉，
  # 这里显式补回来（deepAssign 会把它和 linux.executableArgs 拼成一个数组），
  # 保证 AppImage 用户在没有非特权 user namespace 的内核上照旧能启动。
  executableArgs:
    - '--no-sandbox'
npmRebuild: false
publish:
  provider: github
